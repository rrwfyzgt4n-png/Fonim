<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Fonim project image</title>
  <desc id="description">A translucent layered voice mark beside the Fonim wordmark and the text Local narration workstation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="0.55" stop-color="#171b25"/>
      <stop offset="1" stop-color="#0c0f15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.45" r="0.48">
      <stop offset="0" stop-color="#cbe8ff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#8ec5ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8ec5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8ff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#8fc8ff" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="petalB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dccbff" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#8da8ff" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="petalC" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b7f1ed" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#a3d8ff" stop-opacity="0.34"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="46" fill="url(#background)"/>
  <rect width="1200" height="630" rx="46" fill="url(#glow)"/>
  <path d="M72 505C260 434 415 452 590 501C768 551 950 551 1128 478" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="2"/>
  <path d="M72 535C275 468 441 488 610 530C779 572 949 569 1128 505" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2"/>

  <g transform="translate(126 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="360" rx="92" fill="#f7fbff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.16"/>
    <ellipse cx="180" cy="133" rx="58" ry="121" transform="rotate(-22 180 180)" fill="url(#petalA)"/>
    <ellipse cx="180" cy="133" rx="58" ry="121" transform="rotate(22 180 180)" fill="url(#petalB)"/>
    <ellipse cx="180" cy="224" rx="58" ry="121" transform="rotate(67 180 180)" fill="url(#petalC)"/>
    <ellipse cx="180" cy="224" rx="58" ry="121" transform="rotate(-67 180 180)" fill="url(#petalA)" opacity="0.72"/>
    <circle cx="180" cy="180" r="42" fill="#f5fbff" fill-opacity="0.88"/>
    <g transform="translate(150 151)" fill="#152033" fill-opacity="0.82">
      <rect x="0" y="20" width="8" height="20" rx="4"/>
      <rect x="13" y="10" width="8" height="40" rx="4"/>
      <rect x="26" y="0" width="8" height="60" rx="4"/>
      <rect x="39" y="12" width="8" height="36" rx="4"/>
      <rect x="52" y="21" width="8" height="18" rx="4"/>
    </g>
  </g>

  <g transform="translate(555 205)">
    <text x="0" y="88" fill="#f7f9fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="112" font-weight="650" letter-spacing="-4">Fonim</text>
    <text x="4" y="145" fill="#c1cad8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="500" letter-spacing="0.2">Local narration workstation</text>
    <g transform="translate(4 190)">
      <rect x="0" y="0" width="151" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="75.5" y="28" text-anchor="middle" fill="#dce6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">macOS + SwiftUI</text>
      <rect x="165" y="0" width="187" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="258.5" y="28" text-anchor="middle" fill="#dce6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Multi-backend TTS</text>
    </g>
  </g>
