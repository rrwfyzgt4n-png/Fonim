    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd76b"/><stop offset="1" stop-color="#f2a52b"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#f06a18"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8b24"/><stop offset="1" stop-color="#ee4c0b"/></linearGradient>
    <linearGradient id="p4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f87816"/><stop offset="1" stop-color="#c94305"/></linearGradient>
    <linearGradient id="p5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#df5a08"/><stop offset="1" stop-color="#ad3000"/></linearGradient>
    <linearGradient id="p6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f39a16"/><stop offset="1" stop-color="#d55b06"/></linearGradient>
    <linearGradient id="p7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb426"/><stop offset="1" stop-color="#ed7908"/></linearGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ec"/><stop offset="1" stop-color="#e7cda8"/></linearGradient>
