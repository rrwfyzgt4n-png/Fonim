<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Fonim project image</title>
  <desc id="description">Fonim's cream app tile and eight-petal orange flower icon beside the Fonim wordmark and local narration workstation subtitle.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.56" stop-color="#150d07"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.26" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#f39828" stop-opacity="0.38"/>
      <stop offset="0.58" stop-color="#a84a0c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.5" stop-color="#f5ead9"/>
      <stop offset="1" stop-color="#ead9c3"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
