    <text x="5" y="180" fill="#ded7cf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="500">Local narration workstation</text>

    <g transform="translate(5 225)">
      <rect x="0" y="0" width="235" height="58" rx="29" fill="#0c0b0a" fill-opacity="0.84" stroke="#bd6a16" stroke-width="1.5"/>
      <text x="31" y="38" fill="#f2942e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="700">&lt;/&gt;</text>
      <text x="84" y="38" fill="#f5eee5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="600">macOS + SwiftUI</text>

      <rect x="253" y="0" width="291" height="58" rx="29" fill="#0c0b0a" fill-opacity="0.84" stroke="#bd6a16" stroke-width="1.5"/>
      <g transform="translate(281 18)" fill="#f2942e">
        <rect x="0" y="11" width="4" height="14" rx="2"/>
        <rect x="9" y="5" width="4" height="26" rx="2"/>
        <rect x="18" y="0" width="4" height="36" rx="2"/>
        <rect x="27" y="7" width="4" height="22" rx="2"/>
        <rect x="36" y="12" width="4" height="12" rx="2"/>
