      <use href="#petal" transform="rotate(45 180 180)" fill="url(#p1)" stroke="#e58b16" stroke-width="4"/>
      <use href="#petal" transform="rotate(90 180 180)" fill="url(#p2)" stroke="#e8750c" stroke-width="4"/>
      <use href="#petal" transform="rotate(135 180 180)" fill="url(#p3)" stroke="#e55d07" stroke-width="4"/>
      <use href="#petal" transform="rotate(180 180 180)" fill="url(#p4)" stroke="#d94e03" stroke-width="4"/>
      <use href="#petal" transform="rotate(225 180 180)" fill="url(#p5)" stroke="#c74600" stroke-width="4"/>
      <use href="#petal" transform="rotate(270 180 180)" fill="url(#p6)" stroke="#d96604" stroke-width="4"/>
