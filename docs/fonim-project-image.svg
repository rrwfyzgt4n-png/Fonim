    <rect x="964" y="228" width="3" height="96" rx="1.5"/>
    <rect x="976" y="169" width="3" height="214" rx="1.5"/>
    <rect x="988" y="243" width="3" height="67" rx="1.5"/>
    <rect x="1000" y="203" width="3" height="147" rx="1.5"/>
    <rect x="1012" y="176" width="3" height="201" rx="1.5"/>
    <rect x="1024" y="238" width="3" height="77" rx="1.5"/>
    <rect x="1036" y="196" width="3" height="159" rx="1.5"/>
